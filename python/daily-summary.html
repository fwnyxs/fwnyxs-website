<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Movement Summary</title>
  <style>
    :root{--ink:#16252b;--muted:#63747a;--line:#d8e3e1;--paper:#f3f7f5;--panel:#fff;--accent:#c4552d;--accent-dark:#963719;--danger:#a33a32}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.5 "Segoe UI",sans-serif}.shell{max-width:1600px;margin:auto;padding:42px clamp(20px,4vw,64px) 64px}header{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:36px}.kicker{color:var(--accent);font:700 12px/1.2 Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}h1{margin:8px 0 0;font:600 clamp(32px,5vw,62px)/.98 Georgia,serif;letter-spacing:-.04em}.status{color:var(--muted);font:12px Consolas,monospace;text-align:right}.toolbar{display:grid;grid-template-columns:minmax(180px,240px) minmax(180px,240px) auto;gap:14px;align-items:end;background:var(--panel);border:1px solid var(--line);padding:20px;box-shadow:0 10px 30px #193b4210}label{display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}input{width:100%;border:1px solid #cbd5da;background:#fff;color:var(--ink);padding:11px 12px;font:15px Consolas,monospace}input:focus{outline:2px solid #e9b8a5;border-color:var(--accent)}button{border:0;background:var(--accent);color:#fff;padding:12px 20px;min-height:42px;font-weight:700;cursor:pointer}button:hover{background:var(--accent-dark)}button:disabled{cursor:wait;opacity:.6}.message{min-height:25px;margin:16px 0 10px;color:var(--muted)}.message.error{color:var(--danger)}.table-wrap{overflow:auto;border:1px solid var(--line);background:var(--panel)}table{width:100%;min-width:2050px;border-collapse:collapse}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){text-align:left}th{position:sticky;top:0;color:#52616b;background:#e8f0ed;font:700 11px Consolas,monospace;letter-spacing:.04em;text-transform:uppercase}td{font:13px Consolas,monospace}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fff5f0}.empty{padding:48px;color:var(--muted);text-align:center}@media(max-width:700px){header{align-items:start;flex-direction:column}.status{text-align:left}.toolbar{grid-template-columns:1fr}button{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div><div class="kicker">IBC / LTA SENAI / daily movement summary</div><h1>Daily movement</h1></div><div id="status" class="status">READY / API DISCONNECTED</div></header>
    <div class="toolbar"><div><strong>Current day</strong><br><span class="status">ORACLE SYSDATE / BRANCH 1001121</span></div><button id="run" type="button">REFRESH SUMMARY</button></div>
    <div id="message" class="message" role="status">Loading today's summary...</div>
    <div class="table-wrap"><table><thead id="head"></thead><tbody id="body"><tr><td class="empty" colspan="23">No records loaded.</td></tr></tbody></table></div>
  </main>
  <script>
    const button=document.querySelector('#run'),message=document.querySelector('#message'),status=document.querySelector('#status'),head=document.querySelector('#head'),body=document.querySelector('#body');
    const columns=['BRANCH','HARI','WARGANEGARA','MACHNO','SISTEM','EBIKE_NIISE_MASUK','EBIKE_NIISE_KELUAR','EGATE_QR_MASUK','EGATE_QR_KELUAR','EGATE_PASSPORT_MASUK','EGATE_PASSPORT_KELUAR','INDIVIDUAL_COUNTER_MASUK','INDIVIDUAL_COUNTER_KELUAR','GROUP_COUNTER_MASUK','GROUP_COUNTER_KELUAR','PASSPORT_COUNTER_MASUK','PASSPORT_COUNTER_KELUAR','TRIS_EBIKE_MASUK','TRIS_EBIKE_KELUAR','TRIS_EGATE_QR_MASUK','TRIS_EGATE_QR_KELUAR','JUMLAH_MASUK','JUMLAH_KELUAR','JUMLAH_KESELURUHAN'];
    const labels={BRANCH:'Branch',HARI:'Date',WARGANEGARA:'Citizenship',MACHNO:'Machine',SISTEM:'System',EBIKE_NIISE_MASUK:'eBike NIISe in',EBIKE_NIISE_KELUAR:'eBike NIISe out',EGATE_QR_MASUK:'eGate QR in',EGATE_QR_KELUAR:'eGate QR out',EGATE_PASSPORT_MASUK:'eGate passport in',EGATE_PASSPORT_KELUAR:'eGate passport out',INDIVIDUAL_COUNTER_MASUK:'Individual in',INDIVIDUAL_COUNTER_KELUAR:'Individual out',GROUP_COUNTER_MASUK:'Group in',GROUP_COUNTER_KELUAR:'Group out',PASSPORT_COUNTER_MASUK:'Passport in',PASSPORT_COUNTER_KELUAR:'Passport out',TRIS_EBIKE_MASUK:'TRIS eBike in',TRIS_EBIKE_KELUAR:'TRIS eBike out',TRIS_EGATE_QR_MASUK:'TRIS eGate QR in',TRIS_EGATE_QR_KELUAR:'TRIS eGate QR out',JUMLAH_MASUK:'Total in',JUMLAH_KELUAR:'Total out',JUMLAH_KESELURUHAN:'Grand total'};
    head.innerHTML='<tr>'+columns.map(column=>'<th>'+labels[column]+'</th>').join('')+'</tr>';
    async function loadSummary(){button.disabled=true;message.className='message';message.textContent='Loading today\'s summary...';status.textContent='RUNNING / ORACLE';try{const response=await fetch('/api/daily-summary');const payload=await response.json();if(!response.ok)throw new Error(payload.error||'Request failed');body.innerHTML=payload.rows.length?payload.rows.map(row=>'<tr>'+columns.map(column=>'<td>'+escapeHtml(row[column])+'</td>').join('')+'</tr>').join(''):'<tr><td class="empty" colspan="24">No records found for today.</td></tr>';message.textContent=payload.rows.length+' grouped row'+(payload.rows.length===1?'':'s')+' returned.';status.textContent='CONNECTED / ORACLE'}catch(error){body.innerHTML='<tr><td class="empty" colspan="24">Unable to load summary.</td></tr>';message.className='message error';message.textContent=error.message;status.textContent='ERROR / CHECK SERVER'}finally{button.disabled=false}}
    button.addEventListener('click',loadSummary);loadSummary();
    function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]))}
  </script>
</body>
</html>
