<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movement Monitor | Python</title>
  <style>
    :root{--ink:#17212b;--muted:#65727d;--line:#dbe2e7;--paper:#f7f8f6;--panel:#fff;--accent:#0b766e;--accent-dark:#07534e;--danger:#a33a32}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.5 "Segoe UI",sans-serif}.shell{max-width:1440px;margin:auto;padding:42px clamp(20px,4vw,64px) 64px}header{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:36px}.kicker{color:var(--accent);font:700 12px/1.2 Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}h1{margin:8px 0 0;font:600 clamp(32px,5vw,62px)/.98 Georgia,serif;letter-spacing:-.04em}.status{color:var(--muted);font:12px Consolas,monospace;text-align:right}.toolbar{display:grid;grid-template-columns:minmax(180px,240px) minmax(180px,240px) auto;gap:14px;align-items:end;background:var(--panel);border:1px solid var(--line);padding:20px;box-shadow:0 10px 30px #193b4210}label{display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}input{width:100%;border:1px solid #cbd5da;background:#fff;color:var(--ink);padding:11px 12px;font:15px Consolas,monospace}input:focus{outline:2px solid #9ed7d1;border-color:var(--accent)}button{border:0;background:var(--accent);color:#fff;padding:12px 20px;min-height:42px;font-weight:700;cursor:pointer}button:hover{background:var(--accent-dark)}button:disabled{cursor:wait;opacity:.6}.message{min-height:25px;margin:16px 0 10px;color:var(--muted)}.message.error{color:var(--danger)}.table-wrap{overflow:auto;border:1px solid var(--line);background:var(--panel)}table{width:100%;min-width:1100px;border-collapse:collapse}th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{position:sticky;top:0;color:#52616b;background:#eef3f2;font:700 11px Consolas,monospace;letter-spacing:.06em;text-transform:uppercase}td{font:13px Consolas,monospace}tr:last-child td{border-bottom:0}tbody tr:hover{background:#f0f8f6}.empty{padding:48px;color:var(--muted);text-align:center}@media(max-width:700px){header{align-items:start;flex-direction:column}.status{text-align:left}.toolbar{grid-template-columns:1fr}button{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div><div class="kicker">Python / IBC / B056 movement records</div><h1>Movement monitor</h1></div><div id="status" class="status">READY / API DISCONNECTED</div></header>
    <form id="filters" class="toolbar"><label for="movementDate">Movement date<input id="movementDate" name="movementDate" type="date" value="2026-08-21" required></label><label for="branchCode">Branch code<input id="branchCode" name="branchCode" value="1001121" inputmode="numeric" required></label><button id="run" type="submit">RUN QUERY</button></form>
    <div id="message" class="message" role="status">Choose filters and run the query.</div>
    <div class="table-wrap"><table><thead id="head"></thead><tbody id="body"><tr><td class="empty">No records loaded.</td></tr></tbody></table></div>
  </main>
  <script>
    const form=document.querySelector('#filters'),button=document.querySelector('#run'),message=document.querySelector('#message'),status=document.querySelector('#status'),head=document.querySelector('#head'),body=document.querySelector('#body');
    const columns=['B056_DOC_NUM','B056_NAME','B056_CTRY_DOC','B056_DATE_MOVEMENT','B056_TIME_MOVEMENT','SISTEM','MOVEMENT','B056_CREATE_DATE','B056_UPDATE_DATE','BEZA_SAAT'];
    const labels={B056_DOC_NUM:'Document',B056_NAME:'Name',B056_CTRY_DOC:'Country',B056_DATE_MOVEMENT:'Movement date',B056_TIME_MOVEMENT:'Movement time',SISTEM:'System',MOVEMENT:'Movement',B056_CREATE_DATE:'Created',B056_UPDATE_DATE:'Updated',BEZA_SAAT:'Seconds'};
    head.innerHTML='<tr>'+columns.map(column=>'<th>'+labels[column]+'</th>').join('')+'</tr>';
    form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;message.className='message';message.textContent='Loading records...';status.textContent='RUNNING / ORACLE';const params=new URLSearchParams(new FormData(form));try{const response=await fetch('/api/movements?'+params);const payload=await response.json();if(!response.ok)throw new Error(payload.error||'Request failed');body.innerHTML=payload.rows.length?payload.rows.map(row=>'<tr>'+columns.map(column=>'<td>'+escapeHtml(row[column])+'</td>').join('')+'</tr>').join(''):'<tr><td class="empty" colspan="10">No records found.</td></tr>';message.textContent=payload.rows.length+' record'+(payload.rows.length===1?'':'s')+' returned.';status.textContent='CONNECTED / ORACLE'}catch(error){body.innerHTML='<tr><td class="empty" colspan="10">Unable to load records.</td></tr>';message.className='message error';message.textContent=error.message;status.textContent='ERROR / CHECK SERVER'}finally{button.disabled=false}});
    function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]))}
  </script>
</body>
</html>
