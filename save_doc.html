<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie Card Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0d1321, #111827);
      font-family: Arial, sans-serif;
    }

    .cookie-card {
      position: relative;
      width: 360px;
      padding: 24px;
      border-radius: 24px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(10px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .cookie-card:hover {
      transform: perspective(900px) rotateX(6deg) rotateY(-6deg) translateY(-4px);
      box-shadow: 0 30px 70px rgba(0,0,0,0.45);
    }

    .cookie-content {
      position: relative;
      z-index: 2;
    }

    .tag {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: #dfe9f6;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h3 {
      margin: 16px 0 8px;
      color: #f7fbff;
      font-size: 30px;
    }

    p {
      margin: 0 0 18px;
      color: #d5dce6;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #f6c065, #f59e0b);
      color: #1a1205;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #edf5ff;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(18px);
      opacity: 0.6;
      animation: float 8s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 150px;
      height: 150px;
      right: -20px;
      top: -30px;
      background: rgba(246, 192, 101, 0.9);
    }

    .blob-2 {
      width: 170px;
      height: 170px;
      left: -30px;
      bottom: -40px;
      background: rgba(91, 176, 255, 0.75);
      animation-delay: 1s;
    }

    @keyframes float {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }
      to {
        transform: translate3d(12px, -18px, 0) scale(1.08);
      }
    }
  </style>
</head>
<body>
  <div class="cookie-card">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="cookie-content">
      <span class="tag">Cookies</span>
      <h3>We use cookies</h3>
      <p>To make the site smoother and more personal.</p>

      <div class="actions">
        <button class="btn btn-primary">Accept</button>
        <button class="btn btn-secondary">Learn more</button>
      </div>
    </div>
  </div>

  <script>
    const card = document.querySelector('.cookie-card');

    if (card) {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;

        card.style.transform = `
          perspective(900px)
          rotateX(${(0.5 - y) * 14}deg)
          rotateY(${(x - 0.5) * 14}deg)
          translateY(-4px)
        `;
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(900px) rotateX(0deg) rotateY(0deg) translateY(0)';
      });
    }
  </script>
</body>
</html>
